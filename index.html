
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b192e">
<title>Ethan Nguyen | Digital Business Card</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  padding: 24px 16px;
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  background: #081321;
  color: #ffffff;
  min-height: 100vh;
}
.card {
  max-width: 440px;
  margin: auto;
  padding: 30px 22px;
  text-align: center;
  border: 1px solid #8294aa;
  border-radius: 24px;
  background: linear-gradient(145deg,#172f4e,#0b192e);
  box-shadow: 0 15px 45px #0006;
}
.header {
  font-size: 11px;
  letter-spacing: 3px;
  color: #bac8d8;
  margin-bottom: 25px;
}
.avatar {
  width: 120px;
  height: 120px;
  margin: 0 auto 22px;
  border-radius: 50%;
  border: 3px solid #c7d2df;
  background: #243b55;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 35px;
  color: #dce5ee;
}
.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
h1 {
  font-size: 27px;
  margin: 10px 0 5px;
}
.english {
  color: #c4d0df;
  font-size: 19px;
}
.position {
  margin-top: 22px;
  font-size: 14px;
  letter-spacing: 1px;
  line-height: 1.8;
}
.subtitle {
  color: #b7c5d5;
  font-size: 13px;
}
.companies {
  border-top: 1px solid #60748c;
  border-bottom: 1px solid #60748c;
  padding: 22px 0;
  margin: 22px 0;
  font-size: 17px;
  font-weight: bold;
  line-height: 1.9;
}
.button {
  display: block;
  text-decoration: none;
  padding: 15px 10px;
  border-radius: 12px;
  margin: 10px 0;
  border: 1px solid #8294aa;
  color: #edf3fa;
  font-size: 14px;
}
.primary {
  background: linear-gradient(135deg,#f1f5fa,#a6b7ca);
  color: #0b192e;
  font-weight: bold;
}
.actions {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 8px;
}
.actions .button {
  font-size: 13px;
}
.phone {
  font-size: 16px;
  color: #cbd7e5;
  margin-top: 20px;
}
.footer {
  font-size: 10px;
  letter-spacing: 2px;
  color: #9aacc0;
  margin-top: 30px;
}
</style>
</head>
<body>

<main class="card">

<div class="header">
DIGITAL BUSINESS CARD
</div>

<div class="avatar">
<img src="portrait.jpg"
alt="Ethan Nguyen"
onerror="this.parentElement.textContent='EN'">
</div>

<h1>Nguyễn An Khang</h1>
<div class="english">Ethan Nguyen</div>

<div class="position">
ĐẠI DIỆN THƯƠNG MẠI
</div>
<div class="subtitle">
Commercial Representative
</div>

<div class="companies">
MASTER AG CO., LTD
<br>
CHEMNOVA FACTORY JSC
</div>

<a class="button primary" id="saveContact"
href="#">
＋ Lưu vào danh bạ | Save Contact
</a>

<div class="actions">

<a class="button" href="tel:+84774752946">
☎ Gọi điện<br>Call
</a>

<a class="button"
href="https://zalo.me/84774752946">
Zalo<br>Message
</a>

<a class="button"
href="mailto:nguyenankhang68.masterag@gmail.com">
✉ Email<br>Contact
</a>

</div>

<a class="button"
href="https://masterag.vn">
Master AG | Website
</a>

<div class="phone">
+84 774 752 946
</div>

<div class="footer">
ETHAN NGUYEN • NFC BUSINESS CARD
</div>

</main>

<script>
const vcard = [
"BEGIN:VCARD",
"VERSION:3.0",
"N:Nguyễn;An Khang;;;",
"FN:Nguyễn An Khang (Ethan Nguyen)",
"ORG:Master AG Co.\\, Ltd / Chemnova Factory JSC",
"TITLE:Commercial Representative",
"TEL;TYPE=CELL:+84774752946",
"EMAIL:nguyenankhang68.masterag@gmail.com",
"URL:https://masterag.vn",
"END:VCARD"
].join("\r\n") + "\r\n";

const file = new Blob(
[vcard],
{type:"text/vcard;charset=utf-8"}
);

const link = document.getElementById("saveContact");
link.href = URL.createObjectURL(file);
link.download = "Ethan_Nguyen.vcf";
</script>

</body>
</html>
